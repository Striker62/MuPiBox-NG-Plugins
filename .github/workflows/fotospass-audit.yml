name: FotoSpass code audit
on:
  workflow_dispatch:
  push:
    branches: [main, 'dev/fotospass-*', 'feature/fotospass-*']
    paths:
      - 'examples/fotospass/**'
      - 'tests/test_fotospass_shared.js'
      - 'tests/test_fotospass_admin_upload.cjs'
      - 'tests/test_catalog.py'
      - '.github/workflows/fotospass-audit.yml'
  pull_request:
    paths:
      - 'examples/fotospass/**'
      - 'tests/test_fotospass_shared.js'
      - 'tests/test_fotospass_admin_upload.cjs'
      - 'tests/test_catalog.py'
      - '.github/workflows/fotospass-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check JavaScript and official SDK
        run: |
          node --check examples/fotospass/app.js
          node --check examples/fotospass/mupibox-sdk.js
          node --check examples/fotospass/admin/app.js
          node --check examples/fotospass/admin/upload-store.js
          python3 -c "from pathlib import Path; assert Path('examples/fotospass/mupibox-sdk.js').read_bytes() == Path('sdk/mupibox-sdk.js').read_bytes()"
      - name: Test SMB accessories, photo saving and SDK
        run: |
          node --test tests/test_fotospass_shared.js tests/test_sdk_shared.js tests/test_sdk_photos.js tests/test_sdk_camera_volume.js
          node --test tests/test_fotospass_admin_upload.cjs
          python3 -m unittest discover -s tests -p test_catalog.py -v
      - name: Build and validate FotoSpass package
        id: package
        shell: python
        run: |
          import hashlib, json, os, re, subprocess, sys
          from pathlib import Path
          from zipfile import ZipFile

          source_manifest = json.loads(Path('examples/fotospass/manifest.json').read_text(encoding='utf-8'))
          version = source_manifest['version']
          if not isinstance(version, str) or not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?', version):
              raise SystemExit('Invalid version in FotoSpass manifest')
          package = Path('dist') / f'FotoSpass-{version}.mupiapp'
          subprocess.run([sys.executable, 'tools/mupiapp.py', 'pack', 'examples/fotospass',
                          str(package), '--exclude', 'README.md'], check=True)
          subprocess.run([sys.executable, 'tools/mupiapp.py', 'validate', str(package)], check=True)
          if package.stat().st_size >= 25_000_000:
              raise SystemExit('Package must stay below 25 MB')
          with ZipFile(package) as archive:
              assert archive.testzip() is None
              manifest = json.loads(archive.read('manifest.json'))
              assert manifest['id'] == 'community.fotospass'
              assert manifest['version'] == version
              assert manifest['permissions'] == ['camera', 'photo-save', 'shared-assets']
              assert manifest['sharedDirectories'] == ['accessoires', 'originale']
              assert manifest['admin']['directories'] == ['originale']
          print('SHA256:', hashlib.sha256(package.read_bytes()).hexdigest())
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'path={package.as_posix()}\n')
              output.write(f'name=FotoSpass-{version}\n')
      - name: Install ClamAV antivirus scanner
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam.service || true
          sudo freshclam
      - name: Antivirus scan package and contents
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        run: |
          mkdir -p dist/fotospass-scan
          python3 - <<'PY'
          import os
          from zipfile import ZipFile
          with ZipFile(os.environ['PACKAGE_PATH']) as archive:
              archive.extractall('dist/fotospass-scan')
          PY
          clamscan --infected --scan-archive=yes "$PACKAGE_PATH"
          clamscan --recursive --infected dist/fotospass-scan
      - name: Upload FotoSpass installation package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
