<!doctype html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MuPi CD-Player</title><link rel="stylesheet" href="style.css">
</head><body>
<main>
  <header><h1>MuPi <span>CD-Player</span></h1><button id="exit" type="button" aria-label="Zurück zur MuPiBox">Zurück</button></header>
  <div class="layout">
    <section class="album" aria-label="CD-Laufwerk">
      <div id="disc-art" class="disc-art" aria-hidden="true"><div class="disc-label">MuPi<br>CD</div></div>
      <div class="device-row"><label for="drive">USB-Laufwerk</label><select id="drive" aria-label="USB-Laufwerk auswählen"><option value="">Laufwerk suchen …</option></select><button id="scan" type="button">Suchen</button></div>
      <p id="message" role="status" aria-live="polite">Laufwerk wird gesucht …</p>
    </section>
    <section class="right">
      <div class="list-heading"><h2 id="disc-heading">Keine CD eingelegt</h2><span id="disc-count"></span></div>
      <div id="tracks" class="tracks" aria-label="CD-Titel"><p class="muted">USB-CD-Laufwerk anschließen und eine Audio-CD einlegen.</p></div>
      <nav class="transport" aria-label="CD-Steuerung">
        <button id="previous" type="button" disabled aria-label="Vorheriger Titel">⏮</button>
        <button id="toggle" type="button" class="play" disabled aria-label="Abspielen oder Pause">▶</button>
        <button id="next" type="button" disabled aria-label="Nächster Titel">⏭</button>
        <button id="stop" type="button" disabled aria-label="CD stoppen">■</button>
      </nav>
    </section>
  </div>
</main>
<script src="mupibox-sdk.js"></script><script src="app.js"></script>
</body></html>
