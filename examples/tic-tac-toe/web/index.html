<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>MuPi Kreuz & Kreis – MuPiBox-NG</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="screen">
    <section class="body">
      <div class="info">
        <label for="mode" data-i18n="mode">Spielmodus</label>
        <select id="mode" aria-label="Spielmodus">
          <option value="two" data-i18n="two">2 Spieler</option>
          <option value="easy" data-i18n="easy">Leicht</option>
          <option value="normal" data-i18n="normal" selected>Normal</option>
          <option value="hard" data-i18n="hard">Schwer</option>
        </select>
        <p id="status" class="status" aria-live="polite" data-i18n="loading">Wird geladen …</p>
        <button id="reset" class="primary" disabled type="button" data-i18n="restart">Neue Runde</button>
      </div>
      <div id="board" class="board" role="group" data-i18n-aria="tttTitle" aria-label="MuPi Kreuz & Kreis">
        <button type="button" data-cell="0"></button>
        <button type="button" data-cell="1"></button>
        <button type="button" data-cell="2"></button>
        <button type="button" data-cell="3"></button>
        <button type="button" data-cell="4"></button>
        <button type="button" data-cell="5"></button>
        <button type="button" data-cell="6"></button>
        <button type="button" data-cell="7"></button>
        <button type="button" data-cell="8"></button>
      </div>
    </section>
  </main>
  <script src="./wasm_exec.js"></script>
  <script src="./mupibox-sdk.js"></script>
  <script src="./i18n.js"></script>
  <script src="./app.js"></script>
</body>
</html>
