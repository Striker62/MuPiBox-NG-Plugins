<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>MuPis Rhythm Game</title><link rel="stylesheet" href="style.css"></head><body>
<main><header><strong>MuPis <em>RHYTHM</em></strong><span class="tiny">4 SPUREN · BEAT ARENA</span><button id="exit">Zurück</button></header>
<div class="hud"><label>Tempo <select id="level"><option value="easy">Easy · 112 BPM</option><option value="medium" selected>Normal · 145 BPM</option><option value="hard">Turbo · 176 BPM</option></select></label>
<button id="play" class="primary">▶ START</button><button id="sound">♪ Beat an</button><span class="score" id="score">0</span><span class="combo" id="combo">0× COMBO</span><span class="best" id="best">BEST –</span></div>
<div id="stage"><div class="background-grid"></div><div id="playfield"><div id="lanes"></div><div id="notes"></div></div><div id="judge"></div><div id="pads"></div><div id="banner" aria-live="polite"><span id="headline">READY?</span><small id="subline">Pfeile / Touch · Triff die helle Linie</small></div><span id="status" role="status" style="position:absolute;left:6px;top:5px;color:#a5d1e7;font-size:11px"></span><div id="progress"><div id="progress-fill"></div></div></div>
</main><script src="mupibox-sdk.js"></script><script src="app.js"></script></body></html>
