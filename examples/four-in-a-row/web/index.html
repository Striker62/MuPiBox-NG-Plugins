<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>MuPi 4er-Reihe – MuPiBox-NG</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="screen">
    <button id="exit" class="app-back" type="button" aria-label="Zurück" data-i18n-aria="exit"><span aria-hidden="true">←</span></button>
    <section class="body">
      <div class="info">
        <label for="mode" data-i18n="mode">Spielmodus</label>
        <select id="mode" aria-label="Spielmodus">
          <option value="two" data-i18n="two">2 Spieler</option>
          <option value="easy" data-i18n="easy">Leicht</option>
          <option value="normal" data-i18n="normal" selected>Normal</option>
          <option value="hard" data-i18n="hard">Schwer</option>
        </select>
        <p id="status" class="status" aria-live="polite" data-i18n="loading">Wird geladen …</p>
        <button id="reset" class="primary" type="button" data-i18n="restart">Neue Runde</button>
      </div>
      <div id="board" class="board" role="group" data-i18n-aria="fourTitle" aria-label="MuPi 4er-Reihe"></div>
    </section>
  </main>
  <script src="./mupibox-sdk.js"></script>
  <script src="./i18n.js"></script>
  <script src="./logic.js"></script>
  <script src="./app.js"></script>
</body>
</html>
