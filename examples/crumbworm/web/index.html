<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="transparent">
  <title>MuPi Krümelwurm – MuPiBox-NG</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="screen touch-mode">
    <!-- Native MuPiBox status/navigation bars are hidden; themed in-game exit only. -->
    <button id="exit" class="back-button" type="button"
            data-i18n-aria="wormBack" aria-label="Zurück zur MuPiBox">
      <span aria-hidden="true">←</span>
    </button>
    <nav class="vertical-controls" role="group" aria-label="Hoch und runter">
      <button class="direction direction-up" data-direction="up"
              data-i18n-aria="directionUp" aria-label="Nach oben" type="button">
        <span aria-hidden="true">▲</span>
      </button>
      <button class="direction direction-down" data-direction="down"
              data-i18n-aria="directionDown" aria-label="Nach unten" type="button">
        <span aria-hidden="true">▼</span>
      </button>
    </nav>
    <svg class="mascot" viewBox="0 0 90 90" aria-hidden="true" focusable="false">
      <defs><radialGradient id="mupiFace" cx=".42" cy=".27" r=".75"><stop stop-color="#fff2b8"/><stop offset=".58" stop-color="#ffb142"/><stop offset="1" stop-color="#df5c12"/></radialGradient></defs>
      <g stroke="#db541e" stroke-width="1.3" fill="#ff8e27">
        <path d="M23 38 5 25 11 42 1 45 21 49M23 52 8 57 15 63 8 73 30 65"/>
        <path d="M67 38 85 25 79 42 89 45 69 49M67 52 82 57 75 63 82 73 60 65"/>
        <path d="M23 46 4 44 11 51 3 60 29 55M67 46 86 44 79 51 87 60 61 55"/>
      </g>
      <ellipse cx="45" cy="51" rx="30" ry="29" fill="url(#mupiFace)" stroke="#ffdc75" stroke-width="2"/>
      <ellipse cx="34" cy="43" rx="7" ry="9" fill="#f5ffff"/><ellipse cx="56" cy="43" rx="7" ry="9" fill="#f5ffff"/>
      <ellipse cx="35" cy="45" rx="4" ry="6" fill="#183248"/><ellipse cx="57" cy="45" rx="4" ry="6" fill="#183248"/>
      <circle cx="36" cy="42" r="2" fill="#fff"/><circle cx="58" cy="42" r="2" fill="#fff"/>
      <path d="M34 62 Q45 75 57 62" stroke="#78351f" stroke-width="3" fill="#6e2833" stroke-linecap="round"/>
      <path d="M40 69 Q45 66 50 69" fill="none" stroke="#ff7c8b" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <section class="play-area" aria-label="MuPi Krümelwurm">
      <!-- HUD lives outside the board: no counters cover playable cells. -->
      <div class="scoreboard" role="status" aria-label="Spielstand">
        <span class="hud-title" aria-hidden="true">KRÜMELWURM</span>
        <div><span class="hud-symbol" aria-hidden="true">★</span><span data-i18n="wormScore">Punkte</span><strong id="points">0</strong></div>
        <div><span class="hud-symbol" aria-hidden="true">◆</span><span data-i18n="wormBest">Rekord</span><strong id="best">0</strong></div>
      </div>
      <div class="garden">
        <canvas id="garden" width="600" height="400" role="img"
                data-i18n-aria="gardenBoard" aria-label="Garten-Spielfeld"></canvas>
        <p id="status" class="status" aria-live="polite"></p>
      </div>
      <div class="action-bar">
        <button id="theme-toggle" class="theme-toggle" type="button"
                aria-label="Design wechseln" aria-pressed="false">NEON</button>
        <label class="speed-control" for="speed-select">
          <span data-i18n="wormSpeed">Tempo</span>
          <select id="speed-select" data-i18n-aria="wormSpeed" aria-label="Tempo">
            <option value="easy" data-i18n="wormSpeedEasy">Langsam</option>
            <option value="normal" data-i18n="wormSpeedNormal" selected>Normal</option>
            <option value="hard" data-i18n="wormSpeedHard">Schnell</option>
            <option value="turbo" data-i18n="wormSpeedTurbo">Turbo</option>
          </select>
        </label>
        <nav class="horizontal-controls" role="group" aria-label="Links und rechts">
          <button class="direction direction-left" data-direction="left"
                  data-i18n-aria="directionLeft" aria-label="Nach links" type="button">
            <span aria-hidden="true">◀</span>
          </button>
          <button class="direction direction-right" data-direction="right"
                  data-i18n-aria="directionRight" aria-label="Nach rechts" type="button">
            <span aria-hidden="true">▶</span>
          </button>
        </nav>
      </div>
    </section>
  </main>
  <script src="./mupibox-sdk.js"></script>
  <script src="./i18n.js"></script>
  <script src="./logic.js"></script>
  <script src="./app.js"></script>
</body>
</html>
