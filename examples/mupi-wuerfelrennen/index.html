<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>MuPis Würfelrennen</title><link rel="stylesheet" href="style.css"></head><body>
<div id="app"><header><strong>MuPis <em>Würfelrennen</em></strong><div class="opts"><label>Spieler <select id="playercount"><option value="2">2</option><option value="3">3</option><option value="4" selected>4</option></select></label><label>Menschen <select id="human"><option value="1" selected>1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></label><label>KI <select id="difficulty"><option value="easy">Leicht</option><option value="medium" selected>Mittel</option><option value="hard">Schwer</option></select></label></div><button id="restart">Neu</button><button id="exit">Zurück</button></header>
<div class="workspace"><div id="board" class="board" role="group" aria-label="Großes Würfelrennen-Spielfeld"></div>
<aside class="side"><div id="turn" class="turn"></div><div id="score" class="score"></div>
<div class="dice-row"><div id="dice" aria-live="polite">⚄</div><button id="roll" class="primary">WÜRFELN</button></div>
<div id="status" role="status">Würfle eine Sechs, um zu starten.</div><div class="subtitle">FIGUR AUSWÄHLEN</div><div id="pieces" class="pieces"></div>
<small id="hint">Touch: Figur antippen · Controller: Pfeile &amp; A · Sechs = Extrawurf</small></aside></div></div><script src="mupibox-sdk.js"></script><script src="app.js"></script></body></html>
