<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>MuPi Hnefatafl</title><link rel="stylesheet" href="style.css"></head><body><div id="app"><header><strong>MuPi <em>Hnefatafl</em></strong><span class="tag">Wikinger-Taktik · 11×11</span><button id="exit">Zurück</button></header>
<div class="layout"><div class="board"><svg id="board" viewBox="0 0 440 440" aria-label="Hnefatafl-Brett mit 11 mal 11 Feldern" role="group"></svg></div>
<aside><div class="options"><label>Modus <select id="mode"><option value="local">2 Menschen</option><option value="attack">König verteidigen</option><option value="defend">König angreifen</option></select></label><label>KI <select id="difficulty"><option value="easy">Leicht</option><option value="medium" selected>Mittel</option><option value="hard">Schwer</option></select></label></div>
<div class="turn" id="turn">Angreifer beginnen</div><div id="status" role="status">Verteidige den König oder fange ihn!</div><div class="stats" id="stats"></div>
<div class="actions"><button id="restart">Neues Spiel</button><button id="undo">Zurückziehen</button></div>
<small>Alle Figuren ziehen waagerecht/senkrecht. <b>König:</b> Ecke erreichen. <b>Angreifer:</b> König einkesseln. Touch: Figur → Ziel. Controller: Pfeile, A wählen, B abbrechen.</small></aside></div></div><script src="mupibox-sdk.js"></script><script src="app.js"></script></body></html>
