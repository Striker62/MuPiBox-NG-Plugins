<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wie lange noch?</title><link rel="stylesheet" href="style.css"></head>
<body><img id="background-picture" alt="" hidden><header><button id="exit" aria-label="Zurück zur MuPiBox">‹</button></header>
<main id="card" class="birthday"><div id="scene" aria-hidden="true"><div class="sun"></div><div class="hill one"></div><div class="hill two"></div><div id="symbol">★</div><img id="picture" alt="" hidden></div>
<section class="content"><p id="eyebrow">VORFREUDE IST WUNDERBAR</p><h2 id="title">Dein nächstes Abenteuer</h2><div id="numbers"></div><div id="wait-clock" role="img" aria-label="Warte-Uhr" hidden><svg viewBox="0 0 240 240" aria-hidden="true"><circle class="dial-face" cx="120" cy="120" r="100"/><path id="clock-sector" class="dial-sector"/><circle class="dial-rim" cx="120" cy="120" r="100"/><path class="dial-marks" d="M220 120h-12 M120 220v-12 M20 120h12"/><g id="clock-hand"><path class="dial-hand" d="M120 131V38"/><path class="dial-tip" d="M120 28l-10 19h20Z"/></g><circle class="dial-pin" cx="120" cy="120" r="9"/><text class="dial-star" x="120" y="27" text-anchor="middle">★</text></svg></div><p id="target"></p><p id="message" role="status">Countdowns werden geladen …</p></section><div id="confetti" aria-hidden="true"></div></main>
<nav aria-label="Countdown auswählen"><button id="prev" aria-label="Vorheriger Countdown">‹</button><div id="dots"></div><button id="next" aria-label="Nächster Countdown">›</button></nav>
<script src="mupibox-sdk.js"></script><script src="model.js"></script><script src="app.js"></script></body></html>
